<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f8f3ea" />
    <script>
      // Pick the theme before the first paint so the page never flashes the wrong one. src/theme.jsx keeps it in sync.
      (function () {
        var theme; try { theme = localStorage.getItem('nadopasana-theme'); } catch (error) {}
        if (theme !== 'light' && theme !== 'dark') theme = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = theme;
        document.querySelector('meta[name="theme-color"]').setAttribute('content', theme === 'dark' ? '#19151b' : '#f8f3ea');
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>NadoPasana — Music academy and practice studio</title>
  </head>
  <body><div id="root"></div><script type="module" src="/src/index.jsx"></script></body>
</html>
